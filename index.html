<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spoonbook</title>
<meta name="description" content="Our shared cookbook: recipes, photos, meal plans and the shopping list.">
<meta name="theme-color" content="#1F1A17">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<script src="nutrition.js"></script>
<script src="local.js"></script>
<script src="backend.js"></script>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column (max 560px) — dark "spice box" kitchen book, photo-led, bottom tab bar. */
:root{
  --bg:#1F1A17; --surface:#2B2420; --raise:#352C27; --line:#3A312C;
  --fg:#F4EBDD; --muted:#BFAF9B; --accent:#E8A93A; --on-accent:#1F1A17;
  --ph:#4A3328; --ph-stripe:rgba(232,169,58,.10); --danger:#F08A66; --ok:#9CC48A;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F7F1E8; --surface:#FFFBF5; --raise:#F0E6D8; --line:#E3D6C4;
  --fg:#241C17; --muted:#6B5B4D; --accent:#94570A; --on-accent:#FFFBF5;
  --ph:#E8D6BE; --ph-stripe:rgba(148,87,10,.10); --danger:#A63F1C; --ok:#3F6B2F; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F7F1E8; --surface:#FFFBF5; --raise:#F0E6D8; --line:#E3D6C4;
  --fg:#241C17; --muted:#6B5B4D; --accent:#94570A; --on-accent:#FFFBF5;
  --ph:#E8D6BE; --ph-stripe:rgba(148,87,10,.10); --danger:#A63F1C; --ok:#3F6B2F; color-scheme:light}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
h1,h2,h3{text-wrap:balance}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
.ph{background-color:var(--ph);background-image:repeating-linear-gradient(135deg,var(--ph-stripe) 0 10px,transparent 10px 20px);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-style:italic;color:var(--accent)}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:transparent;display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn.solid{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn{height:48px;padding:0 20px;border-radius:24px;border:1px solid var(--line);background:transparent;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{height:38px;padding:0 14px;font-size:14px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
svg{flex:none}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-style:italic;font-size:26px;color:var(--accent);margin:0;font-weight:500}
.top .row{display:flex;gap:8px}
.hello{font-family:var(--display);font-weight:500;font-size:clamp(36px,10vw,46px);line-height:1;letter-spacing:-.5px;margin:22px 0 18px}
.hello em{color:var(--accent)}
.search{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;border:1px solid var(--line);border-radius:25px;background:var(--surface);color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;color:var(--fg);font-size:16px}
.picks{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:20px -16px 0;padding:0 16px 6px;scrollbar-width:none}
.picks::-webkit-scrollbar{display:none}
.pick{flex:none;width:min(240px,66vw);scroll-snap-align:start;text-decoration:none;color:var(--fg);display:flex;flex-direction:column;gap:10px}
.pick .img{height:280px;border-radius:4px;overflow:hidden;position:relative;font-size:96px}
.pick .img img{width:100%;height:100%;object-fit:cover;display:block}
.pick .tag{position:absolute;left:10px;top:10px;background:var(--bg);color:var(--fg);font-family:var(--body);font-style:normal;font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;padding:5px 9px}
.pick .t{font-family:var(--display);font-size:22px;line-height:1.15}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:transparent;font-size:14px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sec{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px;margin-top:22px}
.list{list-style:none;margin:6px 0 0;padding:0}
.list a{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.thumb{flex:none;width:56px;height:56px;border-radius:4px;overflow:hidden;font-size:26px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.list .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.list .t{font-family:var(--display);font-size:18px;line-height:1.25}
.list .s{font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:4px;background:var(--accent);margin-left:6px;vertical-align:middle}
.empty{padding:40px 8px;text-align:center;color:var(--muted)}
.empty h2{font-family:var(--display);font-weight:500;color:var(--fg);font-size:24px;margin:0 0 8px}

/* recipe */
.hero{position:relative;margin:-20px calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;height:min(56vh,380px);overflow:hidden;font-size:160px}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,var(--bg) 100%);pointer-events:none}
.hero .bar{position:absolute;z-index:2;top:16px;left:16px;right:16px;display:flex;justify-content:space-between}
.hero .bar .icon-btn{background:color-mix(in srgb,var(--bg) 78%,transparent);border-color:transparent}
.hero .ttl{position:absolute;z-index:2;left:max(16px,env(safe-area-inset-left,0px));right:16px;bottom:6px}
.hero h1{font-family:var(--display);font-weight:500;font-size:clamp(32px,9vw,42px);line-height:1.02;margin:6px 0 0}
.hero .eyebrow{color:var(--accent)}
.meta{color:var(--muted);font-size:14px;margin-top:12px;overflow-wrap:anywhere}
.review{margin-top:16px;border:1px dashed var(--accent);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.strip{display:flex;gap:8px;margin-top:16px;overflow-x:auto;padding-bottom:4px}
.strip .ph,.strip button.shot{flex:none;width:64px;height:64px;border-radius:6px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--surface)}
.strip button.shot[aria-current="true"]{border-color:var(--accent)}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
.addshot{flex:none;width:64px;height:64px;border-radius:6px;border:1px dashed var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);gap:2px;cursor:pointer}
.note{margin-top:16px;background:var(--surface);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.note q{font-family:var(--display);font-style:italic;font-size:17px;quotes:"“" "”"}
.note textarea,.field textarea,.field input,.field select,.sheet textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;font-size:16px}
.ctrl{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-top:18px}
.tabs button{height:46px;border:0;border-bottom:2px solid transparent;background:none;padding:0;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:10px;font-weight:600}
.stepper button{width:38px;height:38px;border-radius:19px;border:1px solid var(--line);background:none;font-size:20px;line-height:1}
.ings{list-style:none;margin:8px 0 0;padding:0}
.ings label{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ings input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.ings input:checked+span{color:var(--muted);text-decoration:line-through}
.steps{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:18px}
.steps li{display:flex;gap:14px}
.steps .n{flex:none;width:28px;font-family:var(--display);font-style:italic;font-size:26px;line-height:1;color:var(--accent)}
.steps p{margin:0;color:var(--fg)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock .in{max-width:528px;margin:0 auto;display:flex;gap:10px}
.dock .btn{flex:1;height:54px;border-radius:27px;font-size:17px}

/* cook mode */
.cook{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.cook .head{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:640px;width:100%;margin:0 auto}
.cook .body{flex:1;overflow:auto;max-width:640px;width:100%;margin:0 auto;padding:28px 0}
.cook .big{font-family:var(--display);font-size:clamp(24px,6.4vw,34px);line-height:1.35}
.cook .num{font-family:var(--display);font-style:italic;color:var(--accent);font-size:64px;line-height:1}
.cook .foot{display:flex;gap:10px;max-width:640px;width:100%;margin:0 auto}
.cook .foot .btn{flex:1;height:58px;border-radius:29px;font-size:17px}
.prog{height:3px;background:var(--line);border-radius:2px;max-width:640px;width:100%;margin:12px auto 0}
.prog i{display:block;height:100%;background:var(--accent);border-radius:2px}

/* forms & sheets */
.form{display:flex;flex-direction:column;gap:16px;margin-top:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600;color:var(--muted)}
.field textarea{min-height:160px;line-height:1.45}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cover{display:flex;gap:12px;align-items:center}
.cover .thumb{width:84px;height:84px;font-size:40px}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,8,6,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{font-family:var(--display);font-weight:500;font-size:26px;margin:0}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.opt b{display:block;font-weight:600}
.opt span span{font-size:14px;color:var(--muted)}
.opt .ic{width:44px;height:44px;border-radius:12px;background:var(--raise);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.sheet textarea{min-height:200px}
.hint{font-size:14px;color:var(--muted);margin:0}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

/* shopping */
.shop-add{display:flex;gap:8px;margin-top:18px}
.shop-add input{flex:1;min-width:0;height:48px;border:1px solid var(--line);border-radius:24px;background:var(--surface);padding:0 18px;font-size:16px}
.group h3{margin:22px 0 4px;font-size:12px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}

/* nav */
nav.tabbar{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(528px,calc(100% - 32px));height:62px;border-radius:31px;background:var(--surface);border:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;box-shadow:0 8px 28px rgba(0,0,0,.25)}
nav.tabbar a{display:flex;align-items:center;justify-content:center;gap:6px;height:100%;text-decoration:none;color:var(--muted);font-size:14px;font-weight:600}
nav.tabbar a[aria-current="page"]{color:var(--accent)}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:12px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
/* additions: fridge, sort, ratings, story, timers, plan */
.fridge-link{display:inline-block;margin-top:12px;font-size:15px;font-weight:500;text-decoration:none}
.sortsel select{height:34px;border:1px solid var(--line);border-radius:17px;background:var(--surface);padding:0 12px;font-size:13px;font-weight:600;color:var(--muted)}
.rate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.stars{display:flex}
.stars button{width:40px;height:40px;border:0;background:none;color:var(--accent);display:flex;align-items:center;justify-content:center;padding:0}
.story{margin-top:16px;border-left:0;background:var(--surface);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.story p{margin:0 0 6px}
.story .best{font-family:var(--display);font-size:20px}
.btn.on{background:var(--raise);border-color:var(--accent);color:var(--accent)}
.tbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tbtn{height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.need{margin-top:22px;background:var(--surface);border-radius:12px;padding:14px 16px}
.need ul{margin:6px 0 0;padding-left:18px}
.need li{font-size:17px;padding:2px 0}
#timers{position:fixed;z-index:45;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end;max-width:calc(100% - 32px)}
.timer{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--accent);border-radius:26px;padding:4px 4px 4px 16px;box-shadow:0 6px 20px rgba(0,0,0,.3);min-width:0}
.timer .tl{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.timer b{font-variant-numeric:tabular-nums;font-size:18px;min-width:56px;text-align:right}
.timer .icon-btn{width:40px;height:40px;border:0}
.timer.ring{background:var(--accent);color:var(--on-accent);animation:pulse 1s ease-in-out infinite}
.timer.ring .tl{color:var(--on-accent)}
@keyframes pulse{50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.timer.ring{animation:none}}
.weeknav{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.days{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.day{border-top:1px solid var(--line);padding:14px 0 8px}
.day.today .dh span{color:var(--accent)}
.dh{display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--display);font-size:20px}
.day .list a{border-bottom:0;flex:1;min-width:0}
.prow{display:flex;align-items:center;gap:6px}
.day .hint{margin:4px 0 0}
.daygrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.daygrid .opt{padding:12px}
.picklist{max-height:50vh;overflow:auto;margin:0}
.pickrow{display:flex;align-items:center;gap:12px;width:100%;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.pickrow .thumb{width:44px;height:44px;font-size:20px}
.pickrow .t{font-family:var(--display);font-size:17px}
.units{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px;font-size:14px;color:var(--muted)}
.ainote{display:flex;gap:8px;align-items:flex-start;margin:10px 0 0;font-size:14px;color:var(--muted)}
.ainote svg{width:16px;height:16px;margin-top:3px}
.kcal{margin-top:22px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kc{background:var(--surface);border-radius:10px;padding:10px 8px;display:flex;flex-direction:column;align-items:center}
.kc b{font-family:var(--display);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.kc span{font-size:12px;color:var(--muted)}
.kcal .hint{grid-column:1/-1;margin:2px 0 0}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;font-size:14px}
.switch{flex:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .2s}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:var(--fg);transition:transform .2s}
[aria-checked="true"] .switch{background:var(--accent)}
[aria-checked="true"] .switch i{transform:translateX(20px);background:var(--on-accent)}
@media (prefers-reduced-motion:reduce){.switch,.switch i{transition:none}}
.joincode{display:block;font-family:var(--display);font-size:30px;letter-spacing:6px;color:var(--accent);margin-top:6px}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:22px;font-size:15px;font-weight:500;max-width:calc(100% - 32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<div id="app" aria-live="polite">
  <div class="top"><p class="brand">Spoonbook</p></div>
  <div class="empty"><div class="spin" style="margin:0 auto 14px"></div>Opening your cookbook…</div>
</div>
<nav class="tabbar" id="nav" aria-label="Main">
  <a href="#book" data-tab="book">Book</a>
  <a href="#plan" data-tab="plan">Plan</a>
  <a href="#favourites" data-tab="favourites">Favourites</a>
  <a href="#shopping" data-tab="shopping">Shopping</a>
</nav>
<div id="timers" aria-live="polite" hidden></div>
<div id="overlay"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(() => {
const CATS = ['Curries','Chicken','Beef & pork','Pasta & rice','Pies & bakes','Soups & stews','Sides & starters','Sauces & pastes','Bread & dough','Puddings & treats','Mains'];

/* ---------- quantities ---------- */
const FR = {'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3,'⅛':.125};
const QRE = /^(\d+\s*[½¼¾⅓⅔⅛]|\d+\/\d+|\d+(?:\.\d+)?|[½¼¾⅓⅔⅛])(?:(\s*[-–]\s*)(\d+(?:\.\d+)?))?/;

function fmt(x){
  if (x >= 20) return String(Math.round(x/5)*5);
  const w = Math.floor(x + 1e-9), f = x - w;
  const opts = [[0,''],[.25,'¼'],[1/3,'⅓'],[.5,'½'],[2/3,'⅔'],[.75,'¾'],[1,'']];
  let b = opts[0]; for (const o of opts) if (Math.abs(f-o[0]) < Math.abs(f-b[0])) b = o;
  if (Math.abs(f-b[0]) > .08) return String(Math.round(x*10)/10);
  const whole = b[0] === 1 ? w+1 : w;
  return ((whole ? String(whole) : '') + b[1]) || '0';
}
function scaleLine(line, f){
  if (f === 1) return line;
  const m = line.match(QRE); if (!m) return line;
  const a = fmt(num(m[1]) * f), b = m[3] ? m[2] + fmt(num(m[3]) * f) : '';
  return a + b + line.slice(m[0].length);
}
/* ---------- US → metric ---------- */
const AMT = '(\\d+(?:\\.\\d+)?(?:[\\s-]+\\d+\\/\\d+|\\s*[½¼¾⅓⅔⅛])?|\\d+\\/\\d+|[½¼¾⅓⅔⅛])';
const US_SRC = AMT + '(?:\\s*(?:-|–|to)\\s*' + AMT + ')?\\s*(cups?|pounds?|lbs?\\.?|fl\\.?\\s?oz\\.?|ounces?|oz\\.?)(?![a-z])';
const INCH_SRC = '(\\d+(?:\\.\\d+)?|\\d+\\/\\d+|[½¼¾])\\s*(?:-\\s*)?(?:inch(?:es)?\\b|in\\b(?=-))';
const F_SRC = '(\\d{3})\\s*(?:°\\s*F\\b|degrees\\s*F(?:ahrenheit)?\\b|F\\b)';
const DENSE = [[/bread flour/,130],[/flour/,125],[/icing|powdered sugar/,120],[/brown sugar/,200],[/sugar/,200],[/butter/,225],[/rice/,185],[/oats/,90],[/parmesan|cheese/,100],[/breadcrumb|panko/,60],[/parsley|coriander|cilantro|basil|mint|herbs/,20],[/olives/,140],[/nuts|almonds|walnuts|cashews|peanuts/,140],[/peas/,145],[/cocoa/,85],[/chocolate/,170],[/mushroom/,70],[/spinach|kale/,30],[/onion|pepper|carrot|celery/,150],[/raisins|sultanas/,150],[/sprouts/,100],[/lemongrass|garlic|ginger|shallot/,100],[/popcorn|popping corn/,200]];
function num2(s){ s = s.trim(); let m; if ((m = s.match(/^(\d+)[\s-]+(\d+)\/(\d+)$/))) return +m[1] + m[2]/m[3]; return num(s.replace(/\s+/g, '')); }
function mfmt(v, u){
  const big = u === 'g' ? 'kg' : 'l';
  if (v >= 1000) return (Math.round(v/100)/10) + big;
  const r = v >= 100 ? Math.round(v/10)*10 : v >= 10 ? Math.round(v/5)*5 : Math.max(1, Math.round(v));
  return r + u;
}
function toMetric(line){
  if (!line) return line;
  // "75g/3oz", "500g / 1lb 2oz", "200C/400F": already metric, so drop the imperial half first
  let out = line
    .replace(/(\d\s*(?:g|kg|ml|l))\s*\/\s*[\d.½¼¾⅓⅔⅛\/\s]+(?:lbs?\s*[\d.½¼¾]+\s*oz|fl\.?\s?oz|oz|lbs?|pints?)\b/gi, '$1')
    .replace(/(\d+\s*°?\s*C)\s*\/\s*\d{3}\s*°?\s*F\b/gi, '$1');
  out = out.replace(new RegExp(US_SRC, 'gi'), (m, a, b, unit, off, whole) => {
    const u = unit.toLowerCase().replace(/\./g, '').replace(/\s/g, ''); const rest = whole.slice(off + m.length, off + m.length + 60).toLowerCase();
    let k, mu;
    if (u.startsWith('cup')){ const d = DENSE.find(([re]) => re.test(rest)); k = d ? d[1] : 240; mu = d ? 'g' : 'ml'; }
    else if (u.startsWith('flo')){ k = 29.57; mu = 'ml'; }
    else if (u.startsWith('p') || u.startsWith('lb')){ k = 453.6; mu = 'g'; }

}

function dailyPicks(list){
  const d = new Date(); let seed = d.getFullYear()*400 + d.getMonth()*31 + d.getDate();
  const pool = list.filter(r => r.steps?.length && !/sauce|paste|gravy|marinade|dough|mix/i.test(r.category + ' ' + r.title));
  const out = []; const used = new Set();
  while (out.length < Math.min(5, pool.length)){ seed = (seed * 9301 + 49297) % 233280; const i = Math.floor(seed / 233280 * pool.length); if (!used.has(i)){ used.add(i); out.push(pool[i]); } }
  return out;
}

/* ---------- cooked log & ratings ---------- */
const DAY = 86400000;
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const lastMade = r => (r.cooked || []).length ? Math.max(...r.cooked) : 0;
const madeToday = r => { const l = lastMade(r); return l && dayKey(new Date(l)) === dayKey(new Date()); };
function ago(ts){
  const d = Math.floor((Date.now() - ts) / DAY);
  if (d < 1) return 'today'; if (d < 2) return 'yesterday'; if (d < 14) return d + ' days ago';
  if (d < 60) return Math.round(d/7) + ' weeks ago';
  return new Date(ts).toLocaleDateString('en-GB', { day:'numeric', month:'short', year: d > 300 ? 'numeric' : undefined });
}

/* ---------- timers ---------- */
const T = { list: [] };
try { T.list = JSON.parse(ls.get('sb-timers') || '[]').filter(t => t.end > Date.now() - 30*60000); } catch {}
const saveTimers = () => ls.set('sb-timers', JSON.stringify(T.list));
function durations(step){
  const out = [], re = /(\d+(?:\.\d+)?)(?:\s*(?:-|–|to)\s*\d+(?:\.\d+)?)?\s*(hours?|hrs?|minutes?|mins?|seconds?|secs?)\b/gi; let m;
  while ((m = re.exec(step))){ const n = +m[1], u = m[2].toLowerCase(); const mins = u[0] === 'h' ? n*60 : u[0] === 's' ? n/60 : n; if (mins > 0 && mins <= 1440 && !out.some(o => o.mins === mins)) out.push({ mins, text: m[0] }); }
  return out.slice(0, 3);
}
const timerLabel = m => m >= 60 ? (Math.floor(m/60) + ' hr' + (m % 60 ? ' ' + Math.round(m % 60) + ' min' : '')) : m < 1 ? Math.round(m*60) + ' sec' : Math.round(m) + ' min';
function timerBtns(r, step, n){ return durations(step).map(d => `<button class="tbtn" data-act="timer" data-m="${d.mins}" data-label="${esc(r.title + ' · step ' + n)}">${I.clock} ${timerLabel(d.mins)} timer</button>`).join(''); }

function paintTimers(rebuild){

  if (rebuild || el.dataset.sig !== sig){
    el.dataset.sig = sig; el.hidden = !T.list.length;
    el.innerHTML = T.list.map(t => `<div class="timer${t.done ? ' ring' : ''}"><span class="tl">${esc(t.label)}</span><b data-left="${t.id}">${left(t)}</b><button class="icon-btn" data-act="killtimer" data-id="${t.id}" aria-label="${t.done ? 'Dismiss' : 'Cancel'} timer">${I.close}</button></div>`).join('');
  } else el.querySelectorAll('[data-left]').forEach(b => { const t = T.list.find(x => x.id === b.dataset.left); if (t) b.textContent = left(t); });
}
let actx = null;
document.addEventListener('pointerdown', () => { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume?.(); } catch {} });
function beep(){ try { if (!actx) return; let t = actx.currentTime; for (let i = 0; i < 4; i++){ const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.35, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .35); o.start(t); o.stop(t + .4); t += .55; } } catch {} }

  let rang = false;

  if (rang){ saveTimers(); beep(); try { navigator.vibrate?.([300,150,300]); } catch {} }

/* ---------- ingredients used in a step ---------- */
const STOP = new Set('chopped finely roughly sliced peeled large small medium fresh ground dried freshly tbsp tsp teaspoon teaspoons tablespoon tablespoons cups grams pack packs cans tins clove cloves handful pinch plus extra about into chunks pieces piece optional serve the and with for from your some thinly diced minced crushed grated whole boneless skinless bone-in trimmed halved quartered taste good quality bunch sprig sprigs litre litres knob splash heaped level sachet jar jars stick sticks'.split(' '));
function keyWords(line){ return line.split(',')[0].toLowerCase().replace(/\(.*?\)/g, ' ').replace(/[^a-z\s-]/g, ' ').split(/[\s-]+/).filter(w => w.length > 3 && !STOP.has(w)); }
function stepIngs(r, step, f){
  const s = step.toLowerCase();
  return (r.ingredients || []).filter(l => keyWords(l).some(k => new RegExp('\\b' + k.replace(/(es|s)$/, '')).test(s))).map(l => showLine(scaleLine(l, f)));
}

/* ---------- plan ---------- */
function weekDays(offset){
  const now = new Date(); const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() + 6) % 7) + offset*7);
  return Array.from({ length: 7 }, (_, i) => { const x = new Date(mon); x.setDate(mon.getDate() + i); return x; });
}
const dayName = d => d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
async function setPlan(days){
  const cutoff = dayKey(new Date(Date.now() - 60*DAY)); const keep = {};
  for (const [k, v] of Object.entries(days)) if (k >= cutoff && v.length) keep[k] = v;
  try { await db.doc('lists/plan').set({ days: keep, updatedAt: Date.now() }); } catch (e) { toast(saveErr(e)); }
}

/* ---------- routing ---------- */
function parse(){
  const h = location.hash.slice(1);
  const m = h.match(/^(recipe|cook|edit)-(.+)$/);
  S.view = m ? m[1] : (['favourites','shopping','add','plan','fridge'].includes(h) ? h : 'book');
  S.id = m ? m[2] : null;
  // Ticks belong to the recipe you're in: they survive tabs, cooking mode and edits, and clear once you leave it.
  const inside = ['recipe','cook','edit'].includes(S.view) ? S.id : null;
  for (const k of Object.keys(S.checked)) if (k !== inside) delete S.checked[k];
  if (S.view !== 'recipe'){ S.noteEdit = false; S.confirmDel = false; }
  if (S.view === 'recipe' && S._lastId !== S.id){ S.tab = 'ing'; S.noteEdit = false; S.confirmDel = false; S._lastId = S.id; }
  if (S.view === 'edit' && (!S.draft || S.draft.id !== S.id)){ const r = byId(S.id); S.draft = r ? JSON.parse(JSON.stringify(r)) : null; }
  if (S.view === 'add' && !S.draft) S.draft = blankDraft();
  if (S.view === 'cook'){ S.cookStep = 0; S.cookShowIng = false; }
}
const go = h => { location.hash = h; };
window.addEventListener('hashchange', () => { parse(); render(true); window.scrollTo(0,0); });

    <span class="s">${extra || bits.join(' · ')}</span></span></a></li>`;
}
const SORTS = { az:'A–Z', rated:'Top rated', stale:'Not made lately', made:'Recently made', newest:'Newest' };
function sorted(list){
  const l = [...list];
  if (S.sort === 'rated') l.sort((a, b) => avgRating(b) - avgRating(a));
  if (S.sort === 'stale') l.sort((a, b) => lastMade(a) - lastMade(b));
  if (S.sort === 'made') l.sort((a, b) => lastMade(b) - lastMade(a));
  if (S.sort === 'newest') l.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  return l;
}
function filtered(){
  const q = S.q.trim().toLowerCase();
  let list = S.recipes;
  if (S.view === 'favourites') list = list.filter(r => r.favourite);
  if (S.cat !== 'All') list = list.filter(r => (r.category || 'Mains') === S.cat);
  if (q) list = list.filter(r => (r.title + ' ' + (r.ingredients || []).join(' ')).toLowerCase().includes(q));
  return sorted(list);
}

}

function mins(m){ const h = Math.floor(m/60), mm = m % 60; return (h ? h + ' hr' : '') + (h && mm ? ' ' : '') + (mm ? mm + ' min' : ''); }
function cookView(){
  const r = byId(S.id); if (!r) return '';
  const steps = r.steps || [], n = steps.length, i = Math.min(S.cookStep, Math.max(0, n-1)), f = factor(r);
  return `<div class="cook" role="dialog" aria-label="Cooking ${esc(r.title)}">
    <div class="head"><a class="icon-btn" href="#recipe-${esc(r.id)}" aria-label="Stop cooking">${I.close}</a>
      <span class="eyebrow" style="text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.title)}</span>
      <button class="btn small" data-act="cooking" aria-pressed="${S.cookShowIng}">${S.cookShowIng ? 'Steps' : 'Ingredients'}</button></div>
    <div class="prog" aria-hidden="true"><i style="width:${n ? ((i+1)/n*100) : 0}%"></i></div>
    ${!S.cookShowIng && n > 1 && i === 0 ? `<p class="hint" style="text-align:center;margin:8px 0 0">Swipe left or right to move between steps</p>` : ''}
    <div class="body">${S.cookShowIng
      ? `<ul class="ings">${(r.ingredients || []).map((l, j) => `<li><label><input type="checkbox" data-chg="tick" data-i="${j}" ${(S.checked[r.id] || {})[j] ? 'checked' : ''}><span style="font-size:19px">${esc(showLine(scaleLine(l, f)))}</span></label></li>`).join('')}</ul>`
      : n ? (() => { const need = stepIngs(r, steps[i], f); return `<div class="num">${i+1}<span style="font-size:22px;color:var(--muted)"> / ${n}</span></div><p class="big">${esc(showLine(steps[i]))}</p>
          ${durations(steps[i]).length ? `<div class="tbtns">${timerBtns(r, steps[i], i+1)}</div>` : ''}
          ${need.length ? `<div class="need"><span class="eyebrow">For this step</span><ul>${need.map(l => `<li>${esc(l)}</li>`).join('')}</ul></div>` : ''}`; })()
        : `<p class="big">No steps written yet.</p>`}</div>
    <div class="foot"><button class="btn" data-act="step" data-d="-1" ${i === 0 ? 'disabled' : ''}>Back</button>
      ${i < n-1 ? `<button class="btn primary" data-act="step" data-d="1">Next step</button>` : `<button class="btn primary" data-act="finish">${madeToday(r) ? 'Finish' : 'Finish · we made this'}</button>`}</div>
  </div>`;
}

function planView(){
  const days = weekDays(S.week), today = dayKey(new Date());
  const plan = S.plan.days || {};
  const count = days.reduce((n, d) => n + (plan[dayKey(d)] || []).length, 0);
  const label = S.week === 0 ? 'This week' : S.week === 1 ? 'Next week' : S.week === -1 ? 'Last week' : 'Week of ' + dayName(days[0]);
  return topBar() + `<h1 class="hello">The week’s<br><em>dinners.</em></h1>
  <div class="weeknav"><button class="icon-btn" data-act="week" data-d="-1" aria-label="Previous week">${I.back}</button>
    <span class="eyebrow" style="color:var(--fg)">${label}</span>
    <button class="icon-btn" data-act="week" data-d="1" aria-label="Next week" style="transform:scaleX(-1)">${I.back}</button></div>
  ${count ? `<div class="actions" style="margin-top:12px"><button class="btn small primary" data-act="shopweek">Shop for ${S.week === 0 ? 'this week' : 'this week’s plan'} · ${count} recipe${count > 1 ? 's' : ''}</button></div>` : ''}
  <ol class="days">${days.map(d => { const k = dayKey(d); const ids = plan[k] || [];
    return `<li class="day${k === today ? ' today' : ''}"><div class="dh"><span>${k === today ? 'Today · ' : ''}${dayName(d)}</span><button class="btn small" data-act="planadd" data-day="${k}">${I.plus} Add</button></div>
      ${ids.length ? `<ul class="list">${ids.map(id => { const r = byId(id); if (!r) return ''; return `<li class="prow">${rowHtml(r).replace(/^<li>|<\/li>$/g, '')}<button class="icon-btn" data-act="unplan" data-day="${k}" data-id="${esc(id)}" aria-label="Remove ${esc(r.title)} from ${dayName(d)}">${I.close}</button></li>`; }).join('')}</ul>` : `<p class="hint">Nothing planned.</p>`}</li>`; }).join('')}</ol>`;
}
function fridgeResults(){
  const terms = S.fridge.toLowerCase().split(/[,\n]+/).map(s => s.trim()).filter(s => s.length > 1);
  if (!terms.length) return `<div class="empty">Type a few things you’ve got, separated by commas.</div>`;
  const scored = S.recipes.map(r => { const hay = (r.ingredients || []).join(' ').toLowerCase(); const hit = terms.filter(t => hay.includes(t.replace(/(es|s)$/, ''))); return { r, hit }; })
    .filter(x => x.hit.length).sort((a, b) => b.hit.length - a.hit.length || (a.r.ingredients || []).length - (b.r.ingredients || []).length);
  if (!scored.length) return `<div class="empty">No recipes use any of those. Try simpler words, like “chicken” or “cream”.</div>`;
  return `<ul class="list">${scored.slice(0, 40).map(({ r, hit }) => rowHtml(r, `Uses ${hit.length} of ${terms.length}: ${esc(hit.join(', '))} · ${(r.ingredients || []).length} ingredients`)).join('')}</ul>`;
}

function moreSheet(){

function guessCategory(title, ings){
  const t = (title + ' ' + ings.join(' ')).toLowerCase(), n = title.toLowerCase();
  const rules = [['Curries', /curry|korma|madras|masala|biryani|balti|tikka|massaman|rogan|jalfrezi|dhal|dal\b|tagine/], ['Soups & stews', /soup|stew|casserole|chowder|broth/],
    ['Puddings & treats', /cake|cheesecake|crumble|brownie|cookie|biscuit|pudding|tart|trifle|mousse|ice cream|pavlova|scone|muffin|flapjack/], ['Bread & dough', /bread|dough|loaf|focaccia|bun/],
    ['Sauces & pastes', /sauce|paste|gravy|marinade|dressing|pesto|chutney|dip\b/], ['Pies & bakes', /pie\b|bake\b|lasagne|pasty|quiche|empanada|wellington/],
    ['Pasta & rice', /pasta|spaghetti|penne|risotto|paella|noodle|rice\b|gnocchi|jambalaya|pad thai/], ['Sides & starters', /bhaji|salad|potatoes|yorkshire|wings|starter|side/]];
  for (const [c, re] of rules) if (re.test(n)) return c;
  if (/chicken/.test(t)) return 'Chicken';
  if (/beef|pork|lamb|sausage|bacon|mince|steak|ham\b/.test(t)) return 'Beef & pork';
  return 'Mains';
}
async function readLocally({ text, files, srcUrl, keepPhoto }){
  const msg = overlay.querySelector('#aiMsg');
  overlay.querySelectorAll('[data-act="readpaste"],#snapIn').forEach(b => b.disabled = true);
  try {
    if (files){
      msg.innerHTML = `<div class="thinking"><span class="spin"></span><span id="ocrPct">Getting ready to read the photo… (the first time takes a little longer)</span></div>`;
      text = await Local.readPhotos(files, pct => { const el = document.getElementById('ocrPct'); if (el) el.textContent = `Reading the words… ${pct}%`; });
    }
    const out = Local.parseRecipe(text);
    if (!out.ingredients.length && !out.steps.length) throw { code: 'norecipe' };
    const d = blankDraft();
    d.title = out.title.slice(0, 140);
    d.serves = out.serves || '';
    d.totalMins = out.totalMins || null;
    d.ingredients = out.ingredients;
    d.steps = out.steps;
    d.category = guessCategory(d.title, d.ingredients);
    d.source = srcUrl || '';
    if (keepPhoto && files && S.canPhoto){ msg.innerHTML = `<div class="thinking"><span class="spin"></span>Saving the photo…</div>`; d.photo = await uploadPhoto(files[0]); }
    S.draft = d; closeSheet(); go('add'); if (location.hash === '#add'){ parse(); render(true); }
    toast(out.warnings.length ? out.warnings[0] + '. Fill in what’s missing, then save' : 'Check it over, then save');
  } catch (e) {
    overlay.querySelectorAll('[data-act="readpaste"],#snapIn').forEach(b => b.disabled = false);
    if (!overlay.querySelector('#aiMsg')) return;
    msg.innerHTML = `<p class="hint" style="color:var(--danger)">${
      e?.code === 'norecipe' ? 'Couldn’t find a recipe in that. Make sure the ingredients and method are included.' :
      e?.message === 'load' ? 'The photo reader needs an internet connection the first time. Try again when you’re online.' :
      'Couldn’t read that. Try a clearer, straighter photo in good light, or type it in.'}</p>`;
  }
}

/* ---------- data writes ---------- */
async function patch(id, data){ try { await db.collection('recipes').doc(id).update({ ...data, updatedAt: Date.now() }); } catch (e) { toast(saveErr(e)); throw e; } }
const saveErr = e => e?.code === 'quota_exceeded' ? 'The cookbook is full. Delete a few recipes first.' : 'Couldn’t save that. Check your connection and try again.';
async function setShop(items){ try { await db.doc('lists/shopping').set({ items, updatedAt: Date.now() }); } catch (e) { toast(saveErr(e)); } }
async function shrink(file){
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), 'image/jpeg', .85));
  } catch { return file; }
}
async function uploadPhoto(file){
  const blob = await shrink(file);
  const type = /^image\/(jpeg|png|webp|gif)$/.test(blob.type) ? blob.type : 'image/jpeg';
  const res = await assets.upload(blob, { type });
  return res.id;
}
function photoErr(e){ const c = e?.code; return c === 'too_large' ? 'That photo is too big.' : c === 'unsupported_type' ? 'That file type isn’t supported. Use a JPEG or PNG.' : c === 'quota_or_state' ? 'Photo storage is full.' : 'Couldn’t upload that photo. Try again.'; }

/* ---------- render ---------- */
function render(force){
  if (!db) return;
  if (!force && busy()){ S.pending = true; return; }
  S.pending = false;
  const v = S.view;
  const html = v === 'recipe' ? recipeView() : v === 'cook' ? cookView() : (v === 'edit' || v === 'add') ? editView() : v === 'shopping' ? shopView() : v === 'favourites' ? favView() : v === 'plan' ? planView() : v === 'fridge' ? fridgeView() : bookView();
  if (S.status === 'loading' && !S.recipes.length && v !== 'add') return;
  const y = window.scrollY;
  app.innerHTML = html;
  if (!force) window.scrollTo(0, y);
  const left = (S.shop.items || []).filter(i => !i.done).length;
  nav.hidden = ['cook','edit','add','recipe'].includes(v);
  nav.querySelectorAll('a').forEach(a => {
    a.setAttribute('aria-current', a.dataset.tab === (v === 'fridge' ? 'book' : v) ? 'page' : 'false');
    if (a.dataset.tab === 'shopping') a.innerHTML = 'Shopping' + (left ? ` <span class="badge">${left}</span>` : '');
  });
}
document.addEventListener('focusout', () => setTimeout(() => { if (S.pending && !busy()) render(); }, 0));

    days[k] = list; await setPlan(days);
  },
  week(b){ S.week += +b.dataset.d; render(); },
  async shopweek(b){
    const ids = weekDays(S.week).flatMap(d => S.plan.days?.[dayKey(d)] || []);
    const add = [];
    ids.forEach(id => { const r = byId(id); if (r) (r.ingredients || []).forEach(l => add.push({ id: rid(), text: showLine(l), from: r.title, done: false })); });
    if (!add.length) return;
    b.disabled = true;
    await setShop([...(S.shop.items || []), ...add]);
    S.shop = { ...S.shop, items: [...(S.shop.items || []), ...add] };
    go('shopping');
    setTimeout(() => sortAisles(), 300);
  }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const fn = A[b.dataset.act]; if (!fn) return;
  if (b.tagName === 'A' && !['canceledit','done'].includes(b.dataset.act)) e.preventDefault();
  fn(b, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.sheet) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'shopIn'){ e.preventDefault(); A.additem(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'fridgeIn'){ S.fridge = e.target.value; document.getElementById('fridgeList').innerHTML = fridgeResults(); return; }
  if (e.target.id === 'pickQ'){ document.getElementById('pickList').innerHTML = recipePickList(e.target.value); return; }
  if (e.target.id === 'q'){ S.q = e.target.value; const l = document.getElementById('list'); if (l) l.innerHTML = listHtml(); const p = document.getElementById('picksWrap'); if (p) p.hidden = !!S.q; }
});
document.addEventListener('change', async e => {
  const t = e.target, k = t.dataset.chg; if (!k) return;
  if (k === 'importzip' && t.files[0]){
    const m = document.getElementById('importMsg');
    const say = x => { if (m) m.innerHTML = `<div class="thinking"><span class="spin"></span>${esc(x)}</div>`; };
    say('Opening the backup…');
    try { const res = await Backend.importBackup(t.files[0], say); if (m) m.innerHTML = `<p class="hint">Imported ${res.recipes} recipes and ${res.photos} photos.</p>`; await db.reload?.(); toast('Backup imported'); }
    catch (err) { if (m) m.innerHTML = `<p class="hint" style="color:var(--danger)">${esc(err?.message || 'The import didn’t work. Try again.')}</p>`; }
    return;
  }
  if (k === 'sort'){ S.sort = t.value; ls.set('sb-sort', t.value); t.blur(); document.getElementById('list').innerHTML = listHtml(); return; }
  if (k === 'tick'){ const m = S.checked[S.id] = S.checked[S.id] || {}; m[t.dataset.i] = t.checked; }
  if (k === 'shoptick'){ const items = (S.shop.items || []).map(i => i.id === t.dataset.id ? { ...i, done: t.checked } : i); await setShop(items); }
  if (k === 'photo' && t.files[0]){
    const r = byId(S.id); toast('Uploading photo…');
    try { const id = await uploadPhoto(t.files[0]);
      if (!r.photo) await patch(r.id, { photo: id }); else await patch(r.id, { photos: [...(r.photos || []), id] });
      S.cover[r.id] = id; render(); toast(r.photo ? 'Added to our photos' : 'Photo added');
    } catch (err) { toast(photoErr(err)); }
  }
  if (k === 'cover' && t.files[0]){
    toast('Uploading photo…');
    try { S.draft.title = document.getElementById('f-title').value; const id = await uploadPhoto(t.files[0]);
      const keep = { title: S.draft.title };
      const FIELDS = ['f-cat','f-serves','f-ing','f-steps','f-src','f-best','f-story'];
      FIELDS.forEach(f => keep[f] = document.getElementById(f).value);
      S.draft.photo = id; render(true);
      document.getElementById('f-title').value = keep.title; FIELDS.forEach(f => document.getElementById(f).value = keep[f]);
      toast('Photo ready. Save to keep it');
    } catch (err) { toast(photoErr(err)); }
  }
  if (k === 'snap' && t.files.length){
    const files = [...t.files].slice(0, S.imgMax || 1);
    readLocally({ files: [...t.files].slice(0, 4), keepPhoto: overlay.querySelector('#snapKeep')?.checked });
  }
});

/* ---------- swipe between steps in cooking mode ---------- */
let touch0 = null;
document.addEventListener('touchstart', e => {
  touch0 = (S.view === 'cook' && !S.cookShowIng && e.touches.length === 1 && e.target.closest('.cook') && !e.target.closest('button,a'))
    ? { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() } : null;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!touch0) return;
  const t = e.changedTouches[0], dx = t.clientX - touch0.x, dy = t.clientY - touch0.y, quick = Date.now() - touch0.t < 800;
  touch0 = null;
  if (!quick || Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  const r = byId(S.id); const n = (r?.steps || []).length;
  const next = S.cookStep + (dx < 0 ? 1 : -1);
  if (next < 0 || next >= n) return;
  S.cookStep = next; render(true);
}, { passive: true });

/* ---------- screen wake ---------- */
// Keeps the phone awake the whole time Spoonbook is open on screen. Phones drop the lock whenever the
// app is hidden, so it is asked for again on return and on the next tap (some phones only allow it after a tap).
S.awakeOn = ls.get('sb-awake') !== 'off';
S.awake = 'wakeLock' in navigator ? 'pending' : 'unsupported';
let asking = false;
async function lockScreen(){
  if (!S.awakeOn || wake || asking || S.awake === 'unsupported' || document.visibilityState !== 'visible') return;
  asking = true;
  try {
    wake = await navigator.wakeLock.request('screen'); S.awake = 'on';
    wake.addEventListener('release', () => { wake = null; if (S.awake === 'on') S.awake = 'pending'; });
  } catch { S.awake = 'blocked'; }
  asking = false;
}
function releaseScreen(){ try { wake?.release(); } catch {} wake = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') lockScreen(); });
document.addEventListener('pointerdown', () => { if (!wake) lockScreen(); }, true);

/* ---------- boot ---------- */
parse();
paintTimers(true);
lockScreen();
window.__spoonbookRender = () => render();
Backend.start(async caps => {
  ({ db, assets, user, downloads } = caps);
  S.canPhoto = !!assets; S.canSave = !!downloads;
  S.me = await user.id();

  db.collection('recipes').onSnapshot(snap => {
    S.recipes = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.title || '').localeCompare(b.title || '', 'en', { sensitivity: 'base' }));
    S.status = 'ok';
    if (S.view === 'edit' && !S.draft) parse();
    render(); resolveNames();
  }, () => { S.status = 'none'; render(true); });
  db.doc('lists/shopping').onSnapshot(s => { S.shop = s.exists ? s.data() : { items: [] }; if (S.view !== 'cook') render(); });
  db.doc('lists/plan').onSnapshot(s => { S.plan = s.exists ? s.data() : { days: {} }; if (S.view === 'plan') render(); });
});
})();
</script>

<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
