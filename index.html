<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spoonbook</title>
<meta name="description" content="Our shared cookbook: recipes, photos, meal plans and the shopping list.">
<meta name="theme-color" content="#1F1A17">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<script src="nutrition.js"></script>
<script src="local.js"></script>
<script src="simple.js"></script>
<script src="mail.js"></script>
<script src="diet.js"></script>
<script src="backend.js"></script>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column (max 560px) — dark "spice box" kitchen book, photo-led, bottom tab bar. */
:root{
  --bg:#1F1A17; --surface:#2B2420; --raise:#352C27; --line:#3A312C;
  --fg:#F4EBDD; --muted:#BFAF9B; --accent:#E8A93A; --on-accent:#1F1A17;
  --ph:#4A3328; --ph-stripe:rgba(232,169,58,.10); --danger:#F08A66; --ok:#9CC48A;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F7F1E8; --surface:#FFFBF5; --raise:#F0E6D8; --line:#E3D6C4;
  --fg:#241C17; --muted:#6B5B4D; --accent:#94570A; --on-accent:#FFFBF5;
  --ph:#E8D6BE; --ph-stripe:rgba(148,87,10,.10); --danger:#A63F1C; --ok:#3F6B2F; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F7F1E8; --surface:#FFFBF5; --raise:#F0E6D8; --line:#E3D6C4;
  --fg:#241C17; --muted:#6B5B4D; --accent:#94570A; --on-accent:#FFFBF5;
  --ph:#E8D6BE; --ph-stripe:rgba(148,87,10,.10); --danger:#A63F1C; --ok:#3F6B2F; color-scheme:light}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
h1,h2,h3{text-wrap:balance}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
.ph{background-color:var(--ph);background-image:repeating-linear-gradient(135deg,var(--ph-stripe) 0 10px,transparent 10px 20px);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-style:italic;color:var(--accent)}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:transparent;display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn.solid{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn{height:48px;padding:0 20px;border-radius:24px;border:1px solid var(--line);background:transparent;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{height:38px;padding:0 14px;font-size:14px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
svg{flex:none}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-style:italic;font-size:26px;color:var(--accent);margin:0;font-weight:500}
.top .row{display:flex;gap:8px}
.hello{font-family:var(--display);font-weight:500;font-size:clamp(36px,10vw,46px);line-height:1;letter-spacing:-.5px;margin:22px 0 18px}
.hello em{color:var(--accent)}
.search{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;border:1px solid var(--line);border-radius:25px;background:var(--surface);color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;color:var(--fg);font-size:16px}
.picks{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:16px;margin:20px -16px 0;padding:0 16px 6px;scrollbar-width:none}
.picks::-webkit-scrollbar{display:none}
.pick{flex:none;width:min(240px,66vw);scroll-snap-align:start;text-decoration:none;color:var(--fg);display:flex;flex-direction:column;gap:10px}
.pick .img{height:280px;border-radius:4px;overflow:hidden;position:relative;font-size:96px}
.pick .img img{width:100%;height:100%;object-fit:cover;display:block}
.pick .tag{position:absolute;left:10px;top:10px;background:var(--bg);color:var(--fg);font-family:var(--body);font-style:normal;font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;padding:5px 9px}
.pick .t{font-family:var(--display);font-size:22px;line-height:1.15}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:transparent;font-size:14px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sec{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px;margin-top:22px}
.list{list-style:none;margin:6px 0 0;padding:0}
.list a{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.thumb{flex:none;width:56px;height:56px;border-radius:4px;overflow:hidden;font-size:26px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.list .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.list .t{font-family:var(--display);font-size:18px;line-height:1.25}
.list .s{font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:4px;background:var(--accent);margin-left:6px;vertical-align:middle}
.empty{padding:40px 8px;text-align:center;color:var(--muted)}
.empty h2{font-family:var(--display);font-weight:500;color:var(--fg);font-size:24px;margin:0 0 8px}

/* recipe */
.hero{position:relative;margin:-20px calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;height:min(56vh,380px);overflow:hidden;font-size:160px}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,var(--bg) 100%);pointer-events:none}
.hero .bar{position:absolute;z-index:2;top:16px;left:16px;right:16px;display:flex;justify-content:space-between}
.hero .bar .icon-btn{background:color-mix(in srgb,var(--bg) 78%,transparent);border-color:transparent}
.hero .ttl{position:absolute;z-index:2;left:max(16px,env(safe-area-inset-left,0px));right:16px;bottom:6px}
.hero h1{font-family:var(--display);font-weight:500;font-size:clamp(32px,9vw,42px);line-height:1.02;margin:6px 0 0}
.hero .eyebrow{color:var(--accent)}
.meta{color:var(--muted);font-size:14px;margin-top:12px;overflow-wrap:anywhere}
.review{margin-top:16px;border:1px dashed var(--accent);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.strip{display:flex;gap:8px;margin-top:16px;overflow-x:auto;padding-bottom:4px}
.strip .ph,.strip button.shot{flex:none;width:64px;height:64px;border-radius:6px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--surface)}
.strip button.shot[aria-current="true"]{border-color:var(--accent)}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
.addshot{flex:none;width:64px;height:64px;border-radius:6px;border:1px dashed var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);gap:2px;cursor:pointer}
.note{margin-top:16px;background:var(--surface);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.note q{font-family:var(--display);font-style:italic;font-size:17px;quotes:"“" "”"}
.note textarea,.field textarea,.field input,.field select,.sheet textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;font-size:16px}
.ctrl{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-top:18px}
.tabs button{height:46px;border:0;border-bottom:2px solid transparent;background:none;padding:0;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:10px;font-weight:600}
.stepper button{width:38px;height:38px;border-radius:19px;border:1px solid var(--line);background:none;font-size:20px;line-height:1}
.ings{list-style:none;margin:8px 0 0;padding:0}
.ings label{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ings input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.ings input:checked+span{color:var(--muted);text-decoration:line-through}
.steps{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:18px}
.steps li{display:flex;gap:14px}
.steps .n{flex:none;width:28px;font-family:var(--display);font-style:italic;font-size:26px;line-height:1;color:var(--accent)}
.steps p{margin:0;color:var(--fg)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock .in{max-width:528px;margin:0 auto;display:flex;gap:10px}
.dock .btn{flex:1;height:54px;border-radius:27px;font-size:17px}

/* cook mode */
.cook{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.cook .head{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:640px;width:100%;margin:0 auto}
.cook .body{flex:1;overflow:auto;max-width:640px;width:100%;margin:0 auto;padding:28px 0}
.cook .big{font-family:var(--display);font-size:clamp(24px,6.4vw,34px);line-height:1.35}
.cook .num{font-family:var(--display);font-style:italic;color:var(--accent);font-size:64px;line-height:1}
.cook .foot{display:flex;gap:10px;max-width:640px;width:100%;margin:0 auto}
.cook .foot .btn{flex:1;height:58px;border-radius:29px;font-size:17px}
.prog{height:3px;background:var(--line);border-radius:2px;max-width:640px;width:100%;margin:12px auto 0}
.prog i{display:block;height:100%;background:var(--accent);border-radius:2px}

/* forms & sheets */
.form{display:flex;flex-direction:column;gap:16px;margin-top:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600;color:var(--muted)}
.field textarea{min-height:160px;line-height:1.45}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cover{display:flex;gap:12px;align-items:center}
.cover .thumb{width:84px;height:84px;font-size:40px}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,8,6,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{font-family:var(--display);font-weight:500;font-size:26px;margin:0}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.opt b{display:block;font-weight:600}
.opt span span{font-size:14px;color:var(--muted)}
.opt .ic{width:44px;height:44px;border-radius:12px;background:var(--raise);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.sheet textarea{min-height:200px}
.hint{font-size:14px;color:var(--muted);margin:0}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

/* shopping */
.shop-add{display:flex;gap:8px;margin-top:18px}
.shop-add input{flex:1;min-width:0;height:48px;border:1px solid var(--line);border-radius:24px;background:var(--surface);padding:0 18px;font-size:16px}
.group h3{margin:22px 0 4px;font-size:12px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}

/* nav */
/* bottom bar: full width, fixed to the screen edge, four equal tabs with an icon over each label */
nav.tabbar{position:fixed;z-index:30;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav.tabbar a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.2px}
nav.tabbar a svg{width:24px;height:24px}
nav.tabbar a[aria-current="page"]{color:var(--accent)}
nav.tabbar .badge{position:absolute;top:2px;left:calc(50% + 8px);min-width:18px;height:18px;font-size:11px;padding:0 5px}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:12px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
/* additions: fridge, sort, ratings, story, timers, plan */
.fridge-link{display:inline-block;margin-top:12px;font-size:15px;font-weight:500;text-decoration:none}
.sortsel select{height:34px;border:1px solid var(--line);border-radius:17px;background:var(--surface);padding:0 12px;font-size:13px;font-weight:600;color:var(--muted)}
.rate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.stars{display:flex}
.stars button{width:40px;height:40px;border:0;background:none;color:var(--accent);display:flex;align-items:center;justify-content:center;padding:0}
.story{margin-top:16px;border-left:0;background:var(--surface);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.story p{margin:0 0 6px}
.story .best{font-family:var(--display);font-size:20px}
.btn.on{background:var(--raise);border-color:var(--accent);color:var(--accent)}
.tbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tbtn{height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.need{margin-top:22px;background:var(--surface);border-radius:12px;padding:14px 16px}
.need ul{margin:6px 0 0;padding-left:18px}
.need li{font-size:17px;padding:2px 0}
#timers{position:fixed;z-index:45;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end;max-width:calc(100% - 32px)}
.timer{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--accent);border-radius:26px;padding:4px 4px 4px 16px;box-shadow:0 6px 20px rgba(0,0,0,.3);min-width:0}
.timer .tl{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.timer b{font-variant-numeric:tabular-nums;font-size:18px;min-width:56px;text-align:right}
.timer .icon-btn{width:40px;height:40px;border:0}
.timer.ring{background:var(--accent);color:var(--on-accent);animation:pulse 1s ease-in-out infinite;border:0;font:inherit;padding:10px 10px 10px 18px;cursor:pointer}
.timer.ring .stop{background:var(--on-accent);color:var(--accent);font-weight:700;border-radius:20px;padding:8px 16px;font-size:15px}
.timer.ring .tl{color:var(--on-accent)}
@keyframes pulse{50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.timer.ring{animation:none}}
.weeknav{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.days{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.day{border-top:1px solid var(--line);padding:14px 0 8px}
.day.today .dh span{color:var(--accent)}
.dh{display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--display);font-size:20px}
.day .list a{border-bottom:0;flex:1;min-width:0}
.prow{display:flex;align-items:center;gap:6px}
.day .hint{margin:4px 0 0}
.daygrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.daygrid .opt{padding:12px}
.picklist{max-height:50vh;overflow:auto;margin:0}
.pickrow{display:flex;align-items:center;gap:12px;width:100%;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.pickrow .thumb{width:44px;height:44px;font-size:20px}
.pickrow .t{font-family:var(--display);font-size:17px}
.units{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px;font-size:14px;color:var(--muted)}
.ainote{display:flex;gap:8px;align-items:flex-start;margin:10px 0 0;font-size:14px;color:var(--muted)}
.ainote svg{width:16px;height:16px;margin-top:3px}
.kcal{margin-top:22px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kc{background:var(--surface);border-radius:10px;padding:10px 8px;display:flex;flex-direction:column;align-items:center}
.kc b{font-family:var(--display);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.kc span{font-size:12px;color:var(--muted)}
.kcal .hint{grid-column:1/-1;margin:2px 0 0}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;font-size:14px}
/* offline, what's new, tags */
.offline{margin:10px 0 0;padding:8px 12px;border-radius:10px;background:var(--raise);font-size:13px;color:var(--muted)}
.news{margin:0 0 14px;border:1px solid var(--accent);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.news p{margin:4px 0 0;font-size:15px;line-height:1.45}
.news a{color:var(--accent)}
.news .btn{flex:none}
.chips.tags{margin-top:10px}
.tagline{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tg{font-size:13px;padding:4px 10px;border-radius:12px;background:var(--raise);color:var(--fg)}
.tagset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.tagset legend{font-size:14px;font-weight:600;color:var(--muted);padding:0;margin-bottom:8px}
.tagset .chips{margin:0}
.tagset label.chip{display:inline-flex;align-items:center;cursor:pointer;font-size:14px;font-weight:500;color:var(--muted)}
.tagset label.chip:has(input:checked){background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tagset label.chip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
/* shopping */
.shopbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.usuals{margin-top:18px}

function ago(ts){
  const d = Math.floor((Date.now() - ts) / DAY);
  if (d < 1) return 'today'; if (d < 2) return 'yesterday'; if (d < 14) return d + ' days ago';
  if (d < 60) return Math.round(d/7) + ' weeks ago';
  return new Date(ts).toLocaleDateString('en-GB', { day:'numeric', month:'short', year: d > 300 ? 'numeric' : undefined });
}
function madeLine(r){ const n = (r.cooked || []).length; return n ? `Made ${n === 1 ? 'once' : n === 2 ? 'twice' : n + ' times'} · last ${ago(lastMade(r))}` : ''; }
function avgRating(r){ const v = Object.values(r.ratings || {}).filter(x => x > 0); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0; }

/* ---------- timers ---------- */
const T = { list: [] };
try { T.list = JSON.parse(ls.get('sb-timers') || '[]').filter(t => t.end > Date.now() - 30*60000); } catch {}
const saveTimers = () => ls.set('sb-timers', JSON.stringify(T.list));
function durations(step){
  const out = [], re = /(\d+(?:\.\d+)?)(?:\s*(?:-|–|to)\s*\d+(?:\.\d+)?)?\s*(hours?|hrs?|minutes?|mins?|seconds?|secs?)\b/gi; let m;
  while ((m = re.exec(step))){ const n = +m[1], u = m[2].toLowerCase(); const mins = u[0] === 'h' ? n*60 : u[0] === 's' ? n/60 : n; if (mins > 0 && mins <= 1440 && !out.some(o => o.mins === mins)) out.push({ mins, text: m[0] }); }
  return out.slice(0, 3);
}
const timerLabel = m => m >= 60 ? (Math.floor(m/60) + ' hr' + (m % 60 ? ' ' + Math.round(m % 60) + ' min' : '')) : m < 1 ? Math.round(m*60) + ' sec' : Math.round(m) + ' min';
function timerBtns(r, step, n){ return durations(step).map(d => `<button class="tbtn" data-act="timer" data-m="${d.mins}" data-label="${esc(r.title + ' · step ' + n)}">${I.clock} ${timerLabel(d.mins)} timer</button>`).join(''); }
function startTimer(label, mins){ buzz(25); T.list.push({ id: rid(), label, end: Date.now() + mins*60000, done: false }); saveTimers(); paintTimers(true); toast(timerLabel(mins) + ' timer started'); }
function left(t){ const s = Math.max(0, Math.ceil((t.end - Date.now())/1000)); const h = Math.floor(s/3600), m = Math.floor(s/60) % 60, ss = s % 60; return s ? (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(ss).padStart(2,'0') : 'Done!'; }
function paintTimers(rebuild){
  const el = document.getElementById('timers');
  const sig = T.list.map(t => t.id + (t.done ? 'd' : '')).join();
  if (rebuild || el.dataset.sig !== sig){
    el.dataset.sig = sig; el.hidden = !T.list.length;
    el.innerHTML = T.list.map(t => t.done
      ? `<button class="timer ring" data-act="killtimer" data-id="${t.id}"><span class="tl">${esc(t.label)}</span><b>Time’s up</b><span class="stop">Stop</span></button>`
      : `<div class="timer"><span class="tl">${esc(t.label)}</span><b data-left="${t.id}">${left(t)}</b><button class="icon-btn" data-act="killtimer" data-id="${t.id}" aria-label="Cancel timer">${I.close}</button></div>`).join('');
  } else el.querySelectorAll('[data-left]').forEach(b => { const t = T.list.find(x => x.id === b.dataset.left); if (t) b.textContent = left(t); });
}
let actx = null, out = null;
// phones only allow sound after a tap, so the sound system is woken on the first tap anywhere
document.addEventListener('pointerdown', () => {
  try {
    if (!actx){
      actx = new (window.AudioContext || window.webkitAudioContext)();
      // a compressor lets the alarm run close to full volume without crackling
      const comp = actx.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 8; comp.attack.value = 0.002; comp.release.value = 0.1;
      out = actx.createGain(); out.gain.value = 1; out.connect(comp); comp.connect(actx.destination);
    }
    actx.resume?.();
  } catch {}
});
function burst(){
  // one burst: three quick high-low pips, like a kitchen timer
  try {
    if (!actx || !out) return; actx.resume?.();
    let t = actx.currentTime + 0.02;
    for (let i = 0; i < 6; i++){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square'; o.frequency.value = i % 2 ? 1568 : 1175;
      o.connect(g); g.connect(out);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.9, t + 0.01);
      g.gain.setValueAtTime(0.9, t + 0.11); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
      o.start(t); o.stop(t + 0.14); t += i % 2 ? 0.22 : 0.15;
    }
  } catch {}
}
let ringTick = 0;
setInterval(() => {
  let changed = false;
  for (const t of T.list) if (!t.done && t.end <= Date.now()){ t.done = true; t.rangAt = Date.now(); changed = true; }
  if (changed) saveTimers();
  // keep ringing every couple of seconds until Stop is tapped (gives up after 5 minutes)
  const ringing = T.list.filter(t => t.done && Date.now() - (t.rangAt || t.end) < 5 * 60000);
  if (ringing.length && ringTick++ % 2 === 0){ burst(); try { navigator.vibrate?.([400, 120, 400, 120, 400]); } catch {} }
  if (!ringing.length) ringTick = 0;
  if (T.list.length) paintTimers();
}, 1000);

/* ---------- ingredients used in a step ---------- */
const STOP = new Set('chopped finely roughly sliced peeled large small medium fresh ground dried freshly tbsp tsp teaspoon teaspoons tablespoon tablespoons cups grams pack packs cans tins clove cloves handful pinch plus extra about into chunks pieces piece optional serve the and with for from your some thinly diced minced crushed grated whole boneless skinless bone-in trimmed halved quartered taste good quality bunch sprig sprigs litre litres knob splash heaped level sachet jar jars stick sticks'.split(' '));
function keyWords(line){ return line.split(',')[0].toLowerCase().replace(/\(.*?\)/g, ' ').replace(/[^a-z\s-]/g, ' ').split(/[\s-]+/).filter(w => w.length > 3 && !STOP.has(w)); }
function stepIngs(r, step, f){
  const s = step.toLowerCase();
  return (r.ingredients || []).filter(l => keyWords(l).some(k => new RegExp('\\b' + k.replace(/(es|s)$/, '')).test(s))).map(l => showLine(scaleLine(l, f)));
}

/* ---------- plan ---------- */
function weekDays(offset){
  const now = new Date(); const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() + 6) % 7) + offset*7);
  return Array.from({ length: 7 }, (_, i) => { const x = new Date(mon); x.setDate(mon.getDate() + i); return x; });
}
const dayName = d => d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
async function setPlan(days){
  const cutoff = dayKey(new Date(Date.now() - 60*DAY)); const keep = {};
  for (const [k, v] of Object.entries(days)) if (k >= cutoff && v.length) keep[k] = v;
  try { await db.doc('lists/plan').set({ days: keep, updatedAt: Date.now() }); } catch (e) { toast(saveErr(e)); }
}

/* ---------- routing ---------- */
function parse(){
  const h = location.hash.slice(1);
  const m = h.match(/^(recipe|cook|edit)-(.+)$/);
  S.view = m ? m[1] : (['favourites','shopping','add','plan','fridge','bin'].includes(h) ? h : 'book');
  S.id = m ? m[2] : null;
  // Ticks belong to the recipe you're in: they survive tabs, cooking mode and edits, and clear once you leave it.
  const inside = ['recipe','cook','edit'].includes(S.view) ? S.id : null;
  if (S.view !== 'cook'){ S.cook2 = null; if (S.handsFree) handsFree(false); }
  for (const k of Object.keys(S.checked)) if (k !== inside && k !== S.cook2) delete S.checked[k];
  if (S.view !== 'recipe'){ S.noteEdit = false; S.confirmDel = false; }
  if (S.view === 'recipe' && S._lastId !== S.id){ S.tab = 'ing'; S.noteEdit = false; S.confirmDel = false; S._lastId = S.id; }
  if (S.view === 'edit' && (!S.draft || S.draft.id !== S.id)){ const r = byId(S.id); S.draft = r ? JSON.parse(JSON.stringify(r)) : null; }
  if (S.view === 'add' && !S.draft) S.draft = blankDraft();
  if (S.view === 'cook'){ S.cookStep = 0; S.cookShowIng = false; S.cookStep2 = 0; if (Backend.userId?.()) guideMark('cook'); }
}
const go = h => { location.hash = h; };
window.addEventListener('hashchange', () => { parse(); render(true); window.scrollTo(0,0); app.classList.remove('enter'); void app.offsetWidth; app.classList.add('enter'); });

function rowHtml(r, extra){
  const avg = avgRating(r);

  if (r.totalMins) bits.push(mins(r.totalMins));
  if (avg) bits.push('★ ' + (Math.round(avg*10)/10));
  if (r.cooked?.length) bits.push('made ' + ago(lastMade(r)));
  if (r.spice) bits.push(chillies(r.spice));
  if (r.needsReview) bits.push('needs a check');
  return `<li><a href="#recipe-${esc(r.id)}"><span class="thumb ph">${phOrImg(r)}</span>
    <span class="txt"><span class="t">${esc(r.title)}${r.favourite ? '<span class="dot" title="Favourite"></span>' : ''}</span>

}
const SORTS = { az:'A–Z', rated:'Top rated', stale:'Not made lately', made:'Recently made', newest:'Newest' };
function sorted(list){
  const l = [...list];
  if (S.sort === 'rated') l.sort((a, b) => avgRating(b) - avgRating(a));
  if (S.sort === 'stale') l.sort((a, b) => lastMade(a) - lastMade(b));
  if (S.sort === 'made') l.sort((a, b) => lastMade(b) - lastMade(a));
  if (S.sort === 'newest') l.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  return l;
}
function filtered(){
  const q = S.q.trim().toLowerCase();
  let list = S.recipes;
  if (S.view === 'favourites') list = list.filter(r => r.favourite);
  if (S.cat !== 'All') list = list.filter(r => (r.category || 'Mains') === S.cat);
  if (dietActive()) list = list.filter(dietPasses);
  if (S.tag) list = list.filter(r => S.tag.startsWith('spice:') ? r.spice != null && r.spice === +S.tag.slice(6) : (r.tags || []).includes(S.tag));

}

/* ---------- "Get started" checklist for new cooks: each step ticks itself off when they actually do it ---------- */

// what the other cook has added or changed since this phone last looked
function newsItems(){
  if (!S.seen) return null;
  const fresh = [], changed = [];
  for (const r of S.recipes){
    if (r.addedBy && r.addedBy !== S.me && (r.createdAt || 0) > S.seen) fresh.push(r);
    else if (r.editedBy && r.editedBy !== S.me && (r.editedAt || 0) > S.seen) changed.push(r);
  }
  return fresh.length || changed.length ? { fresh, changed } : null;
}
function newsHtml(){
  const n = newsItems(); if (!n) return '';
  const byWho = (list, verb) => {
    const g = {}; list.forEach(r => { const k = S.names[r.addedBy && verb === 'added' ? r.addedBy : r.editedBy] || 'Someone'; (g[k] = g[k] || []).push(r); });
    return Object.entries(g).map(([name, rs]) => `${esc(name)} ${verb} ${rs.slice(0, 4).map(r => `<a href="#recipe-${esc(r.id)}">${esc(r.title)}</a>`).join(', ')}${rs.length > 4 ? ` and ${rs.length - 4} more` : ''}.`).join(' ');
  };
  return `<div class="news" role="status"><div style="flex:1;min-width:0"><span class="eyebrow">New in the book</span><p>${[n.fresh.length ? byWho(n.fresh, 'added') : '', n.changed.length ? byWho(n.changed, 'changed') : ''].filter(Boolean).join(' ')}</p></div><button class="btn small" data-act="seen">Got it</button></div>`;
}
function freeNote(){
  const p = Backend.plan; if (!p?.enabled || p.plus) return '';
  const n = S.recipes.length; if (n < p.limit - 10) return '';
  return `<p class="offline">${n >= p.limit ? `This cookbook has reached its ${p.limit} free recipes.` : `${n} of ${p.limit} free recipes used.`} <button class="linkbtn" data-act="upgrade">Get Spoonbook Plus</button></p>`;
}
// the line at the top of the book: what's planned today, or something to suit the time, day and season
function greeting(now = new Date()){
  const h = now.getHours(), d = now.getDay(), m = now.getMonth() + 1, date = now.getDate();
  const ids = (S.plan.days?.[dayKey(now)] || []).filter(id => byId(id));
  if (ids.length && h >= 5 && h < 21){
    const r = byId(ids[0]);
    return `${h < 15 ? 'Today' : 'Tonight'},<br><em><a class="hellolink" href="#recipe-${esc(r.id)}">${esc(r.title)}</a>${ids.length > 1 ? ` <span class="more">&amp; ${ids.length - 1} more</span>` : ''}</em>`;
  }
  const special = { '10-31': ['Happy Halloween,', 'something spooky?'], '11-5': ['Bonfire night,', 'something warming.'], '12-24': ['Christmas Eve,', 'something to look forward to.'],
    '12-25': ['Happy Christmas,', 'something special.'], '12-31': ['New Year’s Eve,', 'something to celebrate.'], '1-1': ['Happy New Year,', 'something easy.'], '2-14': ['Valentine’s,', 'something to share.'] }[m + '-' + date];
  if (special) return `${special[0]}<br><em>${special[1]}</em>`;
  const season = m === 12 ? 'festive' : m <= 2 ? 'warm' : m <= 5 ? 'light' : m <= 8 ? 'fresh' : 'warming';
  const me = Backend.members?.find(x => x.user_id === S.me)?.display_name?.split(' ')[0];
  const named = me && date % 2 === 0; // now and then, not every day
  if (h >= 21 || h < 5) return `Late one?<br><em>Something easy.</em>`;
  if (h < 11) return named ? `Morning, ${esc(me)}.<br><em>Something to plan?</em>` : `This morning,<br><em>something to plan.</em>`;
  if (h < 14) return d === 0 ? `Sunday,<br><em>something to share.</em>` : `Lunch,<br><em>something quick.</em>`;
  if (h < 17) return d === 0 ? `Sunday,<br><em>something to share.</em>` : d === 6 ? `Saturday,<br><em>something to bake.</em>` : `This afternoon,<br><em>something to look forward to.</em>`;
  if (d === 5) return `Friday,<br><em>something fun.</em>`;
  return named ? `Evening, ${esc(me)}.<br><em>Something ${season}?</em>` : `Tonight,<br><em>something ${season}.</em>`;
}

}

function fridgeResults(){

  const scored = S.recipes.map(r => { const hay = (r.ingredients || []).join(' ').toLowerCase(); const hit = terms.filter(t => hay.includes(t.replace(/(es|s)$/, ''))); return { r, hit }; })

  return `<ul class="list">${scored.slice(0, 40).map(({ r, hit }) => rowHtml(r, `Uses ${hit.length} of ${terms.length}: ${esc(hit.join(', '))} · ${(r.ingredients || []).length} ingredient${(r.ingredients || []).length === 1 ? '' : 's'}`)).join('')}</ul>`;
}

function guessCategory(title, ings){
  const t = (title + ' ' + ings.join(' ')).toLowerCase(), n = title.toLowerCase();
  const rules = [['Curries', /curry|korma|madras|masala|biryani|balti|tikka|massaman|rogan|jalfrezi|dhal|dal\b|tagine/], ['Soups & stews', /soup|stew|casserole|chowder|broth/],
    ['Puddings & treats', /cake|sponge|cheesecake|crumble|brownie|cookie|biscuit|pudding|tart|trifle|mousse|ice cream|pavlova|scone|muffin|flapjack/], ['Bread & dough', /bread|dough|loaf|focaccia|bun/],
    ['Sauces & pastes', /sauce|paste|gravy|marinade|dressing|pesto|chutney|dip\b/], ['Pies & bakes', /pie\b|bake\b|lasagne|pasty|quiche|empanada|wellington/],
    ['Pasta & rice', /pasta|spaghetti|penne|risotto|paella|noodle|rice\b|gnocchi|jambalaya|pad thai/], ['Sides & starters', /bhaji|salad|potatoes|yorkshire|wings|starter|side/]];
  for (const [c, re] of rules) if (re.test(n)) return c;
  if (/chicken/.test(t)) return 'Chicken';
  if (/beef|pork|lamb|sausage|bacon|mince|steak|ham\b/.test(t)) return 'Beef & pork';
  return 'Mains';
}
// lots of recipes at once, from saved emails or files
async function bulkImport(files){
  const m = overlay.querySelector('#bulkMsg'); const say = t => { if (m) m.innerHTML = `<div class="thinking"><span class="spin"></span>${esc(t)}</div>`; };
  overlay.querySelector('#bulkIn').disabled = true;
  const mails = await Mail.readFiles(files, (i, n) => say(`Reading file ${i} of ${n}…`));
  const have = new Set(S.recipes.map(r => (r.title || '').trim().toLowerCase()));
  const generic = /^(re|fw|fwd|recipe|recipes|a recipe|no subject|\(no subject\)|hi|hello|this|try this)?[!.]*$/i;
  let added = 0, check = 0, dupes = 0, full = false; const skipped = [];
  // read them all first, so if the same recipe turns up twice the fuller copy wins
  const found = new Map();
  for (const x of mails){
    const out = x.text && x.text.length >= 60 ? Local.parseRecipe(x.text) : null;
    if (!out || (!out.ingredients.length && !out.steps.length) || out.ingredients.length + out.steps.length < 2){ skipped.push(x.title || x.file); continue; }
    const title = (x.title && !generic.test(x.title) ? x.title : out.title || x.title || 'Untitled recipe').slice(0, 140);
    const key = title.toLowerCase(), size = out.ingredients.length + out.steps.length;
    if (have.has(key) || (found.has(key) && found.get(key).size >= size)){ dupes++; continue; }
    if (found.has(key)) dupes++;
    found.set(key, { x, out, title, size });
  }
  const todo = [...found.values()];
  for (let i = 0; i < todo.length; i++){
    const { x, out, title } = todo[i]; say(`Adding ${i + 1} of ${todo.length}…`);
    const unsure = out.ingredients.length < 2 || !out.steps.length || out.warnings.length > 0;
    let photo = null; if (x.image && assets){ try { photo = await uploadPhoto(x.image); } catch {} }
    const when = x.date ? x.date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
    const id = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) + '-' + rid().slice(0, 4);
    const data = { title, category: guessCategory(title, out.ingredients), serves: out.serves || '', ingredients: out.ingredients, steps: out.steps, totalMins: out.totalMins || null,
      source: x.source || '', photo, photos: [], note: '', favourite: false, addedBy: S.me, createdAt: Date.now(), updatedAt: Date.now(),
      story: x.from || when ? `From ${x.from ? x.from + '’s' : 'an'} email${when ? ', ' + when : ''}.` : '' };
    if (unsure){ data.needsReview = true; data.reviewNote = 'This came in from an email and looked a bit unusual. Give it a quick check.'; }
    try { await db.collection('recipes').doc(id).set(data); have.add(title.toLowerCase()); added++; if (unsure) check++; }
    catch (e) { if (e?.code === 'free_limit'){ full = true; break; } skipped.push(title); }
  }
  if (!m) return;
  m.innerHTML = `<div class="opt" style="display:block"><b>${added ? `Added ${added} recipe${added > 1 ? 's' : ''}` : 'No new recipes added'}</b>
    <span class="hint" style="display:block;margin-top:6px">${[check ? `${check} ${check > 1 ? 'are' : 'is'} marked “needs a check”: open ${check > 1 ? 'them' : 'it'} to tidy up.` : '',
      dupes ? `${dupes} ${dupes > 1 ? 'were' : 'was'} already in your book.` : '',
      skipped.length ? `${skipped.length} didn’t look like recipes and ${skipped.length > 1 ? 'were' : 'was'} left out${skipped.length <= 6 ? ': ' + esc(skipped.join(', ')) : ''}.` : '',
      full ? 'The cookbook reached its free limit, so the rest weren’t added.' : '',
      added ? 'Sort the book by “Newest” to see them together.' : ''].filter(Boolean).join(' ')}</span></div>
    <button class="btn primary" data-act="bulkdone">Done</button>`;
  if (full) upgradeSheet('limit');
}

async function readLocally({ text, files, srcUrl, keepPhoto }){
  const msg = overlay.querySelector('#aiMsg');
  overlay.querySelectorAll('[data-act="readpaste"],#snapIn').forEach(b => b.disabled = true);
  try {
    if (files){
      msg.innerHTML = `<div class="thinking"><span class="spin"></span><span id="ocrPct">Getting ready to read the photo… (the first time takes a little longer)</span></div>`;
      text = await Local.readPhotos(files, pct => { const el = document.getElementById('ocrPct'); if (el) el.textContent = `Reading the words… ${pct}%`; });
    }
    const out = Local.parseRecipe(text);
    if (!out.ingredients.length && !out.steps.length) throw { code: 'norecipe' };
    const d = blankDraft();
    d.title = out.title.slice(0, 140);
    d.serves = out.serves || '';
    d.totalMins = out.totalMins || null;
    d.ingredients = out.ingredients;
    d.steps = out.steps;
    d.category = guessCategory(d.title, d.ingredients);
    d.source = srcUrl || '';
    if (keepPhoto && files && S.canPhoto){ msg.innerHTML = `<div class="thinking"><span class="spin"></span>Saving the photo…</div>`; d.photo = await uploadPhoto(files[0]); }
    S.draft = d; closeSheet(); go('add'); if (location.hash === '#add'){ parse(); render(true); }
    toast(out.warnings.length ? out.warnings[0] + '. Fill in what’s missing, then save' : 'Check it over, then save');
  } catch (e) {
    overlay.querySelectorAll('[data-act="readpaste"],#snapIn').forEach(b => b.disabled = false);
    if (!overlay.querySelector('#aiMsg')) return;
    msg.innerHTML = `<p class="hint" style="color:var(--danger)">${
      e?.code === 'norecipe' ? 'Couldn’t find a recipe in that. Make sure the ingredients and method are included.' :
      e?.message === 'load' ? 'The photo reader needs an internet connection the first time. Try again when you’re online.' :
      'Couldn’t read that. Try a clearer, straighter photo in good light, or type it in.'}</p>`;
  }
}

async function shrink(file){
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), 'image/jpeg', .85));
  } catch { return file; }
}
async function uploadPhoto(file){
  const blob = await shrink(file);
  const type = /^image\/(jpeg|png|webp|gif)$/.test(blob.type) ? blob.type : 'image/jpeg';
  const res = await assets.upload(blob, { type });
  return res.id;
}

function render(force){
  if (!db) return;
  // typing in the shopping box shouldn't hold the list back: redraw and put the cursor back where it was
  const a = document.activeElement;
  const keep = a && a.id === 'shopIn' && app.contains(a) ? { id: a.id, value: a.value, s: a.selectionStart, e: a.selectionEnd } : null;
  if (!force && !keep && busy()){ S.pending = true; return; }
  S.pending = false;
  const v = S.view;
  const html = v === 'recipe' ? recipeView() : v === 'cook' ? cookView() : (v === 'edit' || v === 'add') ? editView() : v === 'shopping' ? shopView() : v === 'favourites' ? favView() : v === 'plan' ? planView() : v === 'fridge' ? fridgeView() : v === 'bin' ? binView() : bookView();
  if (S.status === 'loading' && !S.recipes.length && v !== 'add') return;
  const y = window.scrollY;
  app.innerHTML = html;
  if (!force) window.scrollTo(0, y);
  if (keep){ const n = document.getElementById(keep.id); if (n){ n.value = keep.value; n.focus({ preventScroll: true }); try { n.setSelectionRange(keep.s, keep.e); } catch {} } }
  const left = (S.shop.items || []).filter(i => !i.done).length;
  nav.hidden = ['cook','edit','add','recipe'].includes(v);
  nav.querySelectorAll('a').forEach(a => {
    a.setAttribute('aria-current', a.dataset.tab === (['fridge', 'bin'].includes(v) ? 'book' : v) ? 'page' : 'false');
    if (a.dataset.tab === 'shopping'){ const bd = a.querySelector('.badge'); bd.textContent = left; bd.hidden = !left; a.setAttribute('aria-label', 'Shopping' + (left ? `, ${left} to buy` : '')); }
  });
}
document.addEventListener('focusout', () => setTimeout(() => { if (S.pending && !busy()) render(); }, 0));

    S.tab = b.dataset.tab; render();
    // if the tabs were stuck at the top, show the start of the other tab rather than somewhere in the middle
    const t2 = document.querySelector('.tabs'); if (wasStuck && t2){ const y = t2.getBoundingClientRect().top + scrollY - parseFloat(getComputedStyle(t2).top || 0); scrollTo(0, Math.max(0, y)); }

    else { const steps = [.5, 1, 1.5, 2, 3, 4]; const cur = S.scale[r.id] ?? 1; const i = steps.indexOf(cur); S.scale[r.id] = steps[Math.max(0, Math.min(steps.length - 1, (i < 0 ? 1 : i) + d))]; }
    render();
  },

  async save(){
    const g = id => document.getElementById(id).value;
    const title = g('f-title').trim();
    if (!title){ toast('Give the recipe a title'); document.getElementById('f-title').focus(); return; }
    const lines = s => s.split('\n').map(x => x.trim()).filter(Boolean);
    const d = S.draft;
    const body = { title, category: g('f-cat'), serves: g('f-serves').trim(), source: g('f-src').trim(),
      ingredients: lines(g('f-ing')), steps: lines(g('f-steps')), photo: d.photo || null,
      bestCook: g('f-best').trim(), story: g('f-story').trim(), updatedAt: Date.now(),
      tags: [...document.querySelectorAll('input[name="f-tag"]:checked')].map(x => x.value), spice: g('f-spice') === '' ? null : +g('f-spice') };
    // the calorie estimate no longer matches once the ingredients change
    if (d.nutrition && JSON.stringify(body.ingredients) !== JSON.stringify(d.ingredients || [])) body.nutrition = null;
    try {
      if (d.id){ await db.collection('recipes').doc(d.id).update({ ...body, editedBy: S.me, editedAt: Date.now() }); S.draft = null; go('recipe-' + d.id); toast('Saved'); }

        const id = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) + '-' + rid().slice(0, 4);

        S.draft = null; go('recipe-' + id); toast('Added to the book');

    } catch (e) { if (e?.code === 'free_limit') upgradeSheet('limit'); else toast(saveErr(e)); }

document.addEventListener('touchmove', e => {
  if (!sw) return; const t = e.touches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y;
  if (!sw.on){ if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)){ sw = null; return; } if (Math.abs(dx) > 14) sw.on = true; else return; }
  sw.dx = dx; sw.li.style.transform = `translateX(${dx}px)`; sw.li.classList.toggle('sw-r', dx > 0); sw.li.classList.toggle('sw-l', dx < 0);
}, { passive: true });
document.addEventListener('touchend', () => {
  if (!sw) return; const { li, dx, on } = sw; sw = null; if (!on) return;
  // the tap that ends a swipe shouldn't also tick the box
  const eat = ev => { ev.preventDefault(); ev.stopPropagation(); };
  addEventListener('click', eat, { capture: true, once: true });
  setTimeout(() => removeEventListener('click', eat, { capture: true }), 400);
  const id = li.dataset.id, item = (S.shop.items || []).find(x => x.id === id);
  if (dx > 90 && item){ buzz(); li.style.transform = 'translateX(100%)'; setTimeout(() => tickShop(id, !item.done), 150); }
  else if (dx < -90 && item){ buzz(20); li.style.transform = 'translateX(-100%)'; setTimeout(() => removeShop(id), 150); }
  else { li.style.transform = ''; li.classList.remove('sw-r', 'sw-l'); }
});

/* ---------- swipe between steps in cooking mode ---------- */
let touch0 = null;
document.addEventListener('touchstart', e => {
  touch0 = (S.view === 'cook' && !S.cookShowIng && !S.cook2 && e.touches.length === 1 && e.target.closest('.cook') && !e.target.closest('button,a'))
    ? { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() } : null;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!touch0) return;
  const t = e.changedTouches[0], dx = t.clientX - touch0.x, dy = t.clientY - touch0.y, quick = Date.now() - touch0.t < 800;
  touch0 = null;
  if (!quick || Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  moveStep(1, dx < 0 ? 1 : -1);
}, { passive: true });

/* ---------- hands-free cooking ----------
   Reads each step out loud and listens for a few short commands, all on the phone (the browser's own
   speech engines). Listening pauses while Spoonbook is talking so it doesn't hear itself. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null, speaking = false;
function moveStep(w, d){
  const r = byId(w === 2 ? S.cook2 : S.id); const n = r ? csteps(r).length : 0; if (!n) return false;
  const cur = w === 2 ? S.cookStep2 : S.cookStep, next = cur + d;
  if (next < 0 || next >= n) return false;
  if (w === 2) S.cookStep2 = next; else S.cookStep = next;
  render(true);
  if (S.handsFree) readStep(w);
  return true;
}
function say(text){
  if (!('speechSynthesis' in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = 'en-GB'; u.rate = 0.95;
  const v = speechSynthesis.getVoices().find(x => x.lang === 'en-GB'); if (v) u.voice = v;
  speaking = true; try { recog?.abort(); } catch {}
  u.onend = u.onerror = () => { speaking = false; setTimeout(listen, 200); };
  speechSynthesis.speak(u);
}
function readStep(w){
  const r = byId(w === 2 ? S.cook2 : S.id); if (!r) return;
  const steps = csteps(r); if (!steps.length) return say('There are no steps written for this one.');
  const i = Math.min(w === 2 ? S.cookStep2 : S.cookStep, steps.length - 1);
  say(`${S.cook2 ? r.title + '. ' : ''}Step ${i + 1}${i === steps.length - 1 ? ', the last step' : ''}. ${showLine(steps[i])}`);
}
function readIngredients(w){
  const r = byId(w === 2 ? S.cook2 : S.id); if (!r) return; const f = factor(r);
  say((r.ingredients || []).length ? 'You need: ' + r.ingredients.map(l => showLine(scaleLine(l, f))).join('. ') : 'No ingredients are written for this one.');
}
function listen(){
  if (!S.handsFree || !S.voiceCmd || !SR || speaking || recog || S.view !== 'cook' || document.visibilityState !== 'visible') return;
  const me = recog = new SR();
  me.lang = 'en-GB'; me.continuous = true; me.interimResults = false;
  me.onresult = e => { const res = e.results[e.results.length - 1]; if (res?.isFinal) command(res[0].transcript); };
  me.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed'){ toast('Spoonbook needs the microphone for voice commands. Steps will still be read out.'); S.noMic = true; }
  };
  me.onend = () => { if (recog === me) recog = null; if (S.handsFree && !speaking && !S.noMic) setTimeout(listen, 300); };
  try { me.start(); } catch { recog = null; }
}
function stopListening(){ const r = recog; recog = null; try { r?.abort(); } catch {} }
function handsFree(on){
  S.handsFree = on;
  if (on){ S.noMic = false; readStep(1); }
  else { stopListening(); try { speechSynthesis.cancel(); } catch {} speaking = false; }
  if (S.view === 'cook') render(true);
}
// voice commands use the microphone, which on Android beeps every time it starts listening, so they're optional
S.voiceCmd = ls.get('sb-voicecmd') === 'on';
function voiceCmd(on){
  if (on && !SR){ toast('This phone can’t listen for voice commands'); return; }
  S.voiceCmd = on; ls.set('sb-voicecmd', on ? 'on' : 'off');
  if (on){ if (!S.handsFree) handsFree(true); else listen(); } else stopListening();
  if (S.view === 'cook') render(true);
}
function stopRinging(){
  const ringing = T.list.filter(t => t.done); if (!ringing.length) return false;
  T.list = T.list.filter(t => !t.done); saveTimers(); paintTimers(true); return true;
}
function command(raw){
  const t = ' ' + raw.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
  if (t.trim().split(' ').length > 6) return; // a short command, not someone chatting in the kitchen
  const w = S.cook2 && /\b(second|two|2|other)\b/.test(t) ? 2 : 1;
  const has = re => re.test(t);
  if (has(/\b(stop|cancel|quiet|silence|enough|shut up)\b/)){ if (!stopRinging()) { try { speechSynthesis.cancel(); } catch {} } return; }
  if (has(/\b(next|forward|continue|done)\b/)){ if (!moveStep(w, 1)) say('That’s the last step.'); return; }
  if (has(/\b(back|previous|last one)\b/)){ if (!moveStep(w, -1)) say('That’s the first step.'); return; }
  if (has(/\bingredients?\b|what do i need/)){ S.cookShowIng = true; render(true); return readIngredients(w); }
  if (has(/\b(steps?|method)\b/)){ S.cookShowIng = false; render(true); return readStep(w); }
  if (has(/\btimer\b/)){
    const r = byId(w === 2 ? S.cook2 : S.id); const steps = r ? csteps(r) : []; const i = Math.min(w === 2 ? S.cookStep2 : S.cookStep, steps.length - 1);
    const d = durations(steps[i] || '')[0];
    if (!d) return say('There’s no time in this step. Say how long, like ten minute timer.');
    startTimer(r.title + ' · step ' + (i + 1), d.mins); return say(timerLabel(d.mins).replace('hr', 'hour').replace('min', 'minute').replace('sec', 'second') + ' timer started.');
  }
  if (has(/\b(read|repeat|again|what)\b/)) return readStep(w);
}
// "ten minute timer" or "set a timer for 5 minutes": a timer with any length
const WORDNUM = { one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9, ten:10, fifteen:15, twenty:20, thirty:30, forty:40, 'forty five':45, sixty:60 };
const _command = command;
command = raw => {
  let t = raw.toLowerCase(); for (const [k, v] of Object.entries(WORDNUM).sort((a, b) => b[0].length - a[0].length)) t = t.replace(new RegExp('\\b' + k + '\\b', 'g'), v);
  const m = t.match(/(\d+(?:\.\d+)?)\s*(hours?|minutes?|mins?|seconds?)\b.*timer|timer\b.*?(\d+(?:\.\d+)?)\s*(hours?|minutes?|mins?|seconds?)/);
  if (m){ const n = +(m[1] || m[3]), u = (m[2] || m[4])[0]; const mins = u === 'h' ? n * 60 : u === 's' ? n / 60 : n; if (mins > 0 && mins <= 1440){ startTimer('Timer', mins); return say(timerLabel(mins).replace('hr', 'hour').replace('min', 'minute').replace('sec', 'second') + ' timer started.'); } }
  return _command(raw);
};
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') listen(); else stopListening(); });

/* ---------- screen wake ---------- */
// Keeps the phone awake the whole time Spoonbook is open on screen. Phones drop the lock whenever the
// app is hidden, so it is asked for again on return and on the next tap (some phones only allow it after a tap).
S.awakeOn = ls.get('sb-awake') !== 'off';
S.awake = 'wakeLock' in navigator ? 'pending' : 'unsupported';
let asking = false;
async function lockScreen(){
  if (!S.awakeOn || wake || asking || S.awake === 'unsupported' || document.visibilityState !== 'visible') return;
  asking = true;
  try {
    wake = await navigator.wakeLock.request('screen'); S.awake = 'on';
    wake.addEventListener('release', () => { wake = null; if (S.awake === 'on') S.awake = 'pending'; });
  } catch { S.awake = 'blocked'; }
  asking = false;
}
function releaseScreen(){ try { wake?.release(); } catch {} wake = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') lockScreen(); });
document.addEventListener('pointerdown', () => { if (!wake) lockScreen(); }, true);

/* ---------- boot ---------- */
parse();
paintTimers(true);
lockScreen();
window.__spoonbookRender = () => render();
Backend.start(async caps => {
  ({ db, assets, user, downloads } = caps);
  S.canEdit = Backend.role !== 'viewer'; S.canPhoto = !!assets && S.canEdit; S.canSave = !!downloads;
  S.me = await user.id();

  const seenKey = 'sb-seen-' + Backend.household.id;
  S.seen = +ls.get(seenKey) || 0;
  if (!S.seen){ S.seen = Date.now(); ls.set(seenKey, String(S.seen)); } // a new phone starts with nothing "new"
  const purged = new Set();
  db.collection('recipes').onSnapshot(snap => {
    const all = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.title || '').localeCompare(b.title || '', 'en', { sensitivity: 'base' }));
    S.recipes = all.filter(r => !r.deletedAt); S.bin = all.filter(r => r.deletedAt);
    S.status = 'ok';
    if (S.view === 'edit' && !S.draft) parse();
    render(); resolveNames();
    S.bin.filter(r => Date.now() - r.deletedAt > 30 * DAY && !purged.has(r.id)).forEach(r => { purged.add(r.id); purgeRecipe(r); });
    setTimeout(handleShared, 0);
  }, () => { S.status = 'none'; render(true); });
  db.doc('lists/pantry').onSnapshot(s => { S.pantry = s.exists ? s.data() : null; if (S.view === 'shopping') render(); });
  db.doc('lists/shopping').onSnapshot(s => { S.shop = s.exists ? s.data() : { items: [] }; if (S.view !== 'cook') render(); });
  db.doc('lists/plan').onSnapshot(s => { S.plan = s.exists ? s.data() : { days: {} }; if (S.view === 'plan' || S.view === 'book') render(); });
});
})();
</script>

<div id="updateBar" class="updatebar" role="status" hidden><span>Spoonbook has been updated</span><button type="button" onclick="location.reload()">Refresh</button></div>
<script>
// When a new version is published, the phone picks it up in the background; this offers a one-tap refresh
// rather than needing the app closed and opened twice.
if ('serviceWorker' in navigator) addEventListener('load', async () => {
  const had = !!navigator.serviceWorker.controller;
  let reg; try { reg = await navigator.serviceWorker.register('sw.js'); } catch { return; }
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) document.getElementById('updateBar').hidden = false; });
  const check = () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); };
  document.addEventListener('visibilitychange', check);
  setInterval(check, 30 * 60000);
});
</script>
